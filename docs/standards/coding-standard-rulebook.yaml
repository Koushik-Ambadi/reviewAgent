  - id: ABS-SCS-13.1.b
    section: '13.1'
    title: Spaces
    source:
      file_page: 23
      document_page: 22
    level: mandatory
    status: active
    statement: Each assignment operator =, +=, -=, *=, /=, %=, &=, |=, ^=, ~=, and != shall have one space before
      and after it.
    applies_to:
      - source_formatting
    verification:
      methods:
        - formatter
        - token_scan
      automation: 'yes'
      suggested_check: operator_spacing
    classifications:
      - strict_rule
      - configuration_required
      - decision_required
    implementation_notes:
      decision_required: true
      analysis_requirements:
        - project_specific_configuration
      verification_approach:
        - formatter
        - token_scan
      blocker: The source lists ~= as an assignment operator even though it is not a C operator, and lists != both
        here and as a binary operator.
      implementation_decision: Ignore ~= for valid C tokens and enforce spacing around != through the binary-operator
        rule; record this interpretation in tool configuration.
      accepted_examples:
        - value += 1u;
        - lhs != rhs
      rejected_examples:
        - value+=1u;
        - lhs!=rhs
