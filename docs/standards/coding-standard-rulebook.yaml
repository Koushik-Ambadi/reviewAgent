classification_definitions:
  strict_rule: A deterministic predicate can be implemented for all or part of the rule.
  semantic_rule: Compliance depends on source meaning or intent, not syntax alone.
  context_dependent: Applicability or outcome depends on surrounding code, artifact, lifecycle, or project context.
  human_review_required: A human must judge quality, risk, clarity, necessity, or an unresolved exception.
  configuration_required: A deterministic check requires project, toolchain, platform, vocabulary, or scope configuration.
  decision_required: The standard does not fully define an implementation choice needed for a pass/fail result.
