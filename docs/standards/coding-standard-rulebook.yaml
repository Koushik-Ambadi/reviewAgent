  file_page_count: 66
  printed_document_page_count: 65
  rulebook_purpose: Single source of truth for developers, review managers, artifact-verification engines, and review
    agents.
  source_modal_policy:
    shall_must_never: mandatory
    should_preferred_encouraged_avoid: recommended or preferred as written
    when_appropriate_when_applicable: conditional mandatory rule requiring semantic context
