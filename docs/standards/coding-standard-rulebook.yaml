  - section: '5'
    source:
      file_page: 7
      document_page: 6
    type: footnote
    note: The coding standard is not itself a safety standard; appropriate safety guidelines remain required where
      malfunction or insecurity could injure people.
  - section: '11.1'
    source:
      file_page: 10
      document_page: 9
    type: footnote
    note: The source points to the C90 and C99 standards for the referenced ISO C language versions.
  - section: '11.1'
    source:
      file_page: 10
      document_page: 9
    type: footnote
    note: C99-compatible compilers provide useful language features including C++-style comments, Boolean and fixed-width
      types, inline functions, and local declarations.
  - section: '11.8'
    source:
      file_page: 18
      document_page: 17
    type: footnote
    note: Missing volatile qualifiers can create intermittent optimization-sensitive defects; disabling optimization
      is not a substitute.
  - section: '12.2'
    source:
      file_page: 21
      document_page: 20
    type: footnote
    note: Design-by-contract tests or assertions can be stronger than comments for documenting assumptions.
  - section: '14.2'
    source:
      file_page: 30
      document_page: 29
    type: footnote
    note: '#pragma once serves the same purpose as an include guard but is non-portable.'
  - section: '15.3'
    source:
      file_page: 35
      document_page: 34
    type: footnote
    note: MISRA C describes problems that can arise from mixing essential types in its appendices.
  - section: '15.3'
    source:
      file_page: 35
      document_page: 34
    type: footnote
    note: CERT C provides additional explanation of signed/unsigned and related integer issues.
  - section: '17.2'
    source:
      file_page: 50
      document_page: 49
    type: footnote
    note: Review eye-movement research supports placing variable declarations close to their first use, which conflicts
      with the source preference for the top of the function.
  - section: '18.3'
    source:
      file_page: 53
      document_page: 52
    type: footnote
    note: The default-block requirement is equivalent to requiring a default case in every switch.
  - section: '18.4'
    source:
      file_page: 54
      document_page: 53
    type: footnote
    note: sizeof-based array sizing can fail when a pointer is passed instead of the array.
  - section: '18.4'
    source:
      file_page: 54
      document_page: 53
    type: footnote
    note: for (;;) is preferred for infinite loops and avoids confusion with while (l).
  - section: '19'
    source:
      file_page: 57
      document_page: 56
    type: footnote
    note: The source-code metrics are defined according to the HIS standard.
