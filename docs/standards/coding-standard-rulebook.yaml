naming_schemas:
  variable:
    id: ABS-SCS-17.1.SCHEMA
    section: '17.1'
    title: Variable Naming Convention
    source:
      file_pages:
        - 47
        - 48
        - 49
      document_pages:
        - 46
        - 47
        - 48
    level: mandatory_for_application_layer
    statement: 'Variable names use three underscore-separated parts: TsMxxx_Uxxx_Dxxx.'
    regex_template: ^(?=.{1,31}$)[CFKLNVM][aemst]{MODULE}_{UNIT}_{DESCRIPTION}$
    parts:
      T:
        length: 1
        case: uppercase
        allowed:
          C: CAN signal
          F: fixed nonvolatile calibration
          K: volatile calibration
          L: local volatile variable
          N: global nonvolatile variable
          V: global volatile variable
          M: structure member
      s:
        length: 1
        case: lowercase
        allowed:
          a: array or vector
          e: element
          m: matrix
          s: structure or CAN message
          t: table
      Mxxx:
        length:
          min: 3
          max: 6
        format: One uppercase letter followed by lowercase letters.
        regex: ^[A-Z][a-z]{2,5}$
        allowed_values_reference: controlled_vocabularies.module_abbreviations
      Uxxx:
        length_as_table_heading:
          min: 1
          max: 5
        length_as_prose:
          min: 3
          max: 5
        allowed_values_reference: controlled_vocabularies.units
      Dxxx:
        length:
          min: 14
          max: 22
        format: Descriptive lowerCamelCase for multi-word names.
        regex: ^[a-z][A-Za-z0-9]{13,21}$
        guidelines:
          - Accurately describe the variable purpose.
          - Avoid abbreviations unless widely understood and accepted.
          - Use the naming convention consistently throughout the codebase.
    total_max_length: 31
    verification:
      methods:
        - naming_check
        - controlled_vocabulary_check
        - semantic_metadata_check
      automation: partial
    classifications:
      - strict_rule
      - semantic_rule
      - configuration_required
      - decision_required
    implementation_notes:
      decision_required: true
      blocker: The source conflicts on module and unit lengths, source examples use pc while the unit table lists
        pct, Dxxx is semantic, and the component maxima can exceed the total 31-character limit.
      implementation_decision: Treat vocabulary membership and the 31-character total as hard checks; choose whether
        pc aliases pct; apply lowerCamelCase inside Dxxx and underscores only between schema parts; version all
        extensions.
      accepted_examples:
        - VeSoc_pct_battEstimatedSoc
      rejected_examples:
        - VeSoc_pc_battEstimatedSoc unless pc is explicitly configured as an alias
        - VxUnknown_bad_value
    source_examples:
      - value: VeSoc_pc_battEstimatedSoc
        status: conflicts_with_units_table_pc_vs_pct
      - value: LeSoc_pc_battEstimatedSoc
        status: conflicts_with_units_table_pc_vs_pct
      - value: KtSoc_V_cellTempSoc2Voc
        status: contains_digit_requiring_semantic_interpretation
  function:
    source:
      file_page: 40
      document_page: 39
    format: '{MODULE}_{snake_case_description}'
    regex_template: ^(?=.{1,31}$){MODULE}_[a-z][a-z0-9]*(?:_[a-z0-9]+)*$
    semantic_constraints:
      - Descriptive purpose
      - Prefer noun-verb action naming or question-answer naming
      - set/get encouraged
