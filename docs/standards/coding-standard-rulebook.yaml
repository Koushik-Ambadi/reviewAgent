rules:
  - id: ABS-SCS-1.MIN_PROCESS
    section: '1'
    title: Introduction & Purpose
    source:
      file_page: 4
      document_page: 3
    level: recommended
    status: active
    statement: The software development process should include version control, defect tracking, formal architecture
      or design reviews, peer code reviews, and automated source-code scans.
    applies_to:
      - project_process
    verification:
      methods:
        - process_audit
      automation: manual
    classifications:
      - context_dependent
      - human_review_required
      - configuration_required
      - decision_required
    implementation_notes:
      decision_required: true
      analysis_requirements:
        - context_dependent_analysis
        - cross_file_or_repository_analysis
        - human_judgment
        - project_specific_configuration
      verification_approach:
        - process_audit
      blocker: A strict source-local Yes/No check is insufficient because compliance depends on applicability and
        surrounding context, cross-file or repository evidence, human quality or risk judgment, project-specific
        configuration not fixed by the standard.
      implementation_decision: Define the authoritative inputs, scope, exceptions, and pass/fail threshold in versioned
        verifier configuration; route unresolved cases to human review.
      accepted_examples:
        - Repository, defect tracker, recorded design and peer reviews, and a build-time static-analysis report
          are all present.
      rejected_examples:
        - Source is version-controlled, but no defect tracker, formal review evidence, or automated scan exists.
