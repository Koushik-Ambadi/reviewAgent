version: 2

metadata:
  name: "ABS Default Policy"

reporting:
  include_passed_cases: true

ast:
  target_folders:
    - src

  target_extensions:
    - .c
    - .h

  libclang_path: auto

checks:

  repository_structure:

    required_paths:

      # ---------- VALID ----------
      - absdef/
      - app/
      - bs_cfg/
      - build/
      - cfg/
      - design/
      - docs/
      - node_modules/
      - s32k344-freertos/
      - s32k344-mcal/
      - src/
      - src/{module}.c
      - src/{module}.h
      - src/{module}_model.c
      - src/{module}_model.h
      - .clang-format
      - .gitattributes
      - .gitignore
      - .gitmodules
      - .releasefilelist
      - build.log
      - clean-up.bat
      - cmake-build.bat
      - CMakeLists.txt
      - CMakePresets.json
      - README.md

    forbidden_paths: []

    allowed_extensions: []

    forbidden_extensions: []

    required_file_types: []

    tree_rules: []

    size_rules: []

  symbol_naming:

    function_names:

      pattern: "^[A-Z][A-Za-z0-9]*(_[a-z0-9]+)+$"

      applicability_exclusions:
        - "^look\\d_"
        - "^plook_"
        - "^intrp"
        - "^binsearch_"

    macro_names:

      macro_name_pattern: "^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$"

      macro_value_type: "value"

      applicability_exclusions:
        - "^{module}_IN_"

    array_sizes:

      enforce_symbolic_array_sizes: true

    global_variable_names:

      name_max_length: 31

      allowed_chars_pattern: "^[A-Za-z0-9_]+$"

      description_pattern: "^[a-z][A-Za-z0-9]*$"

      excluded_type_patterns:
        - "^B_.*_T$"
        - "^DW_.*_T$"
        - "^ConstP_.*_T$"
        - "^rt[A-Z].*$"
        - "^Tmp.*$"

      data_types:
        - C
        - F
        - K
        - N
        - V
        - L
        - M

      data_sizes:
        - e
        - a
        - m
        - s
        - t

      modules:
        - Adcmgr
        - Atddrv
        - Atdif
        - Auxcon
        - Balctl
        - Battsm
        - Calmgr
        - Canstk
        - Cantcv
        - Cellmdl
        - Cellmnt
        - Chrg
        - Conctl
        - Coul
        - Crcmgr
        - Curlmt
        - Cvtnsm
        - Dcfc
        - Dcmmgr
        - Dchrg
        - Didmgr
        - Dtcmgr
        - Hall
        - Htrctl
        - Hwio
        - Hvil
        - Inhibt
        - Limctl
        - Nmsm
        - Nvmdrv
        - Nvmmgr
        - Ocp
        - Otemp
        - Ovuv
        - Packsm
        - Pchrg
        - Pwrmnt
        - Pyro
        - Qrcode
        - Rtcmgr
        - Shunt
        - Soc
        - Soe
        - Soh
        - Sohc
        - Sohr
        - Sop
        - Srs
        - Sysmgr
        - Syssm
        - Therm
        - Tmpmnt
        - Udsstk
        - Uepm
        - VITDgn

      units:
        - A
        - mA
        - kA
        - V
        - mV
        - kV
        - Ah
        - kAh
        - Wh
        - kWh
        - W
        - kW
        - degC
        - degF
        - us
        - ms
        - sec
        - hrs
        - day
        - Hz
        - kHz
        - Ohm
        - bi
        - frc
        - nu
        - pct
        - cnt
        - ix
        - tau

      description_min_length: 14

      description_max_length: 22

      enforce_module_required: true

      enforce_unit_required: true

      enforce_description_required: true